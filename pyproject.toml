[project]
name = "margin-copilot-shared"
version = "0.5.0"
description = "Shared by the Margin Copilot services: reply contracts, token checks, request context, OBO."
requires-python = ">=3.12,<3.13"
dependencies = [
  "azure-identity==1.27.0",
  "azure-monitor-opentelemetry==1.8.12",
  "cryptography==50.0.2",
  "msal==1.39.0",
  "opentelemetry-instrumentation-asgi==0.66b2",
  "pydantic==2.14.3",
  "pyjwt[crypto]==2.15.1",
  "starlette==1.10.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
